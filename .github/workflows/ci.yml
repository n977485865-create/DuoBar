name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: State and native drawing tests
        run: ./scripts/test.sh
      - name: Build Apple Silicon and Intel app
        run: ./scripts/build.sh
      - name: Verify universal binary and signature
        run: ./scripts/verify-app.sh build/DuoBar.app
      - name: Prepare installable validation app
        run: ditto -c -k --norsrc --noextattr --noacl --keepParent build/DuoBar.app build/DuoBar-validation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DuoBar-validation
          path: build/DuoBar-validation.zip
          retention-days: 7
